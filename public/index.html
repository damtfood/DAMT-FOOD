<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAMT Food — Murugan Trader</title>
<link rel="icon" href="/logo.png">
<style>
  :root { --bg:#fff8ea; --fg:#2a1d08; --accent:#b8860b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14100a; --fg:#f5ead2; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; box-sizing:border-box; }
  img { width:min(220px,60vw); height:auto; }
  h1 { margin:16px 0 4px; font-size:2rem; }
  p { margin:4px 0; opacity:.8; }
  a.btn { display:inline-block; margin-top:20px; padding:12px 22px; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="Murugan Trader logo">
  <h1>DAMT Food</h1>
  <p>Food &amp; grocery delivery by Murugan Trader</p>
  <p>Android apps coming soon.</p>
  <a class="btn" href="https://adpc.shop">Visit Murugan Trader</a>
</main>
</body>
</html>
